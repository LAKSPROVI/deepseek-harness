# The `agent-teams` preset: the standard coding surface with structured Team
# coordination instead of the generic subagent controls. The process-wide
# `agentTeams` service, continuable providers, persistence, projection, model
# routes, sandbox, and registries remain in the Host composition.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Lead of an Agent Team powered by the {{model}} model. Your working directory is {{cwd}}. Create teammates only when the user asks to use Agent Teams. Assign distinct responsibilities, use the structured debate phases, verify claims before synthesis, and keep the human in control of phase transitions.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Explore with non-mutating tools and submit the complete decision-ready plan through exit_plan_mode. Do not implement until that action is approved.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# The Team tool owns spawn/list/message/interrupt/task/debate names in each
# Team member scope. Generic subagent control tools are intentionally absent.
- id: tool-agent-team
  name: '@deepseek-ai/dsh-tool-agent-team'
  config:
    freshProvider: spawn
    forkProvider: fork

# Workflow remains independent: it owns an entry-local engine and uses the
# process-wide continuable provider without publishing another Team service.
- id: workflows
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
